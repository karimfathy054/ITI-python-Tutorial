{% extends "layout.html" %} {% block body %}

<div class="container">
  <h1>Books List</h1>
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Price</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for book in books %}
      <tr>
        <td>{{ book.id }}</td>
        <td>{{ book.title }}</td>
        <td>{{ book.price }}</td>
        <td>
          <a href="{% url 'books:show' book.id %}" class="btn btn-primary"
            >view</a
          >
          <a href="{% url 'books:edit' book.id %}" class="btn btn-secondary"
            >Edit</a
          >
          <a href="{% url 'books:delete' book.id %}" class="btn btn-danger"
            >Delete</a
          >
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="4">No books found</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  <a href="{% url 'books:create' %}" class="btn btn-primary">Add book</a>
</div>

{% endblock body %}
