{% extends "layout.html" %} {% block body %}
<div class="container">
  <h1>Edit Book {{book.id}}</h1>
  <form action="{% url 'books:update' book.id %}" method="post">
    {% csrf_token %} 
    {{form.as_p}}
    <button type="submit" class="btn btn-primary">Update</button>
  </form>
</div>
{% endblock %}
